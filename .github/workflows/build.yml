name: Build AppImage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build AppImage
        run: npm run electron:build

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: dangerous-ant-farm-appimage
          path: dist/*.AppImage
